name: Health Check Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Runtime Libraries
        run: |
          pip install --no-cache-dir playwright ddddocr Pillow
          playwright install --with-deps chromium

      - name: Execute Sync
        env:
          LEME_USERNAME: ${{ secrets.LEME_USERNAME }}
          LEME_PASSWORD: ${{ secrets.LEME_PASSWORD }}
          LEME_SERVER_1: ${{ secrets.LEME_SERVER_1 }}
          LEME_USERNAME_2: ${{ secrets.LEME_USERNAME_2 }}
          LEME_PASSWORD_2: ${{ secrets.LEME_PASSWORD_2 }}
          LEME_SERVER_2: ${{ secrets.LEME_SERVER_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PY_PAYLOAD: ${{ secrets.PY_PAYLOAD }}
        run: |
          echo "$PY_PAYLOAD" | base64 -d > run_task.py
          python run_task.py
