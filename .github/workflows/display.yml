name: Display Secrets Structured

# امکان اجرای دستی از تب Actions
on:
  workflow_dispatch:

jobs:
  show-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Print Secrets Safely and Structured
        env:
          LEME_USERNAME: ${{ secrets.LEME_USERNAME }}
          LEME_PASSWORD: ${{ secrets.LEME_PASSWORD }}
          LEME_SERVER_1: ${{ secrets.LEME_SERVER_1 }}
          LEME_USERNAME_2: ${{ secrets.LEME_USERNAME_2 }}
          LEME_PASSWORD_2: ${{ secrets.LEME_PASSWORD_2 }}
          LEME_SERVER_2: ${{ secrets.LEME_SERVER_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PY_PAYLOAD: ${{ secrets.PY_PAYLOAD }}
        run: |
          python3 -c '
          import os, base64

          secrets = [
              "LEME_USERNAME",
              "LEME_PASSWORD",
              "LEME_SERVER_1",
              "LEME_USERNAME_2",
              "LEME_PASSWORD_2",
              "LEME_SERVER_2",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "PY_PAYLOAD"
          ]

          print("==================================================")
          print("        روش اول: نمایش با فاصله (خوانا)          ")
          print("   (برای استفاده، فاصله‌های بین حروف را حذف کنید)   ")
          print("==================================================\n")

          for key in secrets:
              val = os.environ.get(key, "")
              if val:
                  # ایجاد فاصله بین کاراکترها برای دور زدن سانسور گیت‌هاب
                  spaced_val = " ".join(list(val))
                  print(f"🔹 {key}:")
                  print(f"{spaced_val}\n")
              else:
                  print(f"🔸 {key}: [EMPTY OR NOT SET]\n")

          print("==================================================")
          print("        روش دوم: فرمت Base64 (دقیق و بدون تغییر) ")
          print("  (مناسب برای PY_PAYLOAD و رمزهای دارای کاراکتر خاص)")
          print("==================================================\n")

          for key in secrets:
              val = os.environ.get(key, "")
              if val:
                  b64_val = base64.b64encode(val.encode("utf-8")).decode("utf-8")
                  print(f"🔹 {key} (Base64):")
                  print(f"{b64_val}\n")
          '
